<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RéaCom V2.2 multilingue — test</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f5;font-family:system-ui,-apple-system,Arial,sans-serif;color:#17242d}header{background:#237f8a;color:white;padding:16px}h1{margin:0;font-size:27px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}select{font-size:18px;padding:10px;border-radius:12px;border:2px solid white;background:white;color:#17242d;max-width:60%}.phrase{background:#ffffff22;border-radius:18px;padding:18px;font-size:24px;font-weight:800;min-height:68px;overflow-wrap:anywhere}.staff{font-size:15px;background:#ffffff18;padding:8px 12px;border-radius:10px;margin-top:8px}.headbuttons{display:flex;gap:12px;margin-top:12px}.headbuttons button{flex:1;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:800}main{padding:18px 14px 115px;max-width:850px;margin:auto}.label{font-size:19px;font-weight:900;letter-spacing:.04em;color:#61717a;margin:4px 3px 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.category,.item{border:0;border-radius:22px;min-height:145px;padding:16px 8px;font-size:20px;font-weight:800;box-shadow:0 3px 10px #0001;overflow-wrap:anywhere}.category{color:white;background:var(--c)}.item{background:white;border-top:7px solid var(--c);color:#17242d}.icon{display:block;font-size:48px;margin-bottom:8px}.back{border:0;background:#dce7e9;border-radius:14px;padding:12px 16px;font-size:18px;font-weight:800;margin-bottom:15px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:white;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr .45fr;gap:10px;box-shadow:0 -2px 10px #0002}.bottom button{border:0;border-radius:18px;color:white;padding:17px 5px;font-size:22px;font-weight:900}.yes{background:#278b58}.no{background:#c63b2e}.homebtn{background:#596873}.screen{background:white;border:3px solid #9db3b9;border-radius:18px;min-height:85px;padding:17px;font-size:30px;font-weight:850;margin-botto .item .patient-label{display:block;font-weight:800}.item .fr-translation{display:block;font-size:15px;font-weight:600;color:#536772;margin-top:8px;line-height:1.3;direction:ltr;text-align:center}.staff{direction:ltr;text-align:left;font-weight:700}.staff[hidden]{display:none!important}</style></head><body><header><div class="top"><h1>RéaCom <small style="font-size:12px">V2.1 TEST</small></h1><select id="language" aria-label="Langue"><option value="fr">🌐 Français</option><option value="en">🇬🇧 English</option><option value="ar">🇸🇦 العربية</option><option value="es">🇪🇸 Español</option><option value="de">🇩🇪 Deutsch</option><option value="it">🇮🇹 Italiano</option></select></div><div class="phrase" id="phrase"></div><div class="staff" id="staff" hidden></div><div class="headbuttons"><button id="speak"></button><button id="clear"></button></div></header><main><section id="accueil"><div class="label" id="choose"></div><div class="grid" id="categories"></div></section><section id="categorie" hidden><button class="back" id="back1"></button><div class="label" id="title"></div><div class="grid" id="items"></div></section><section id="clavier" hidden><button class="back" id="back2"></button><div class="label" id="write"></div><div class="screen" id="typed"></div><div class="keys" id="keys"></div></section><p class="note" id="note"></p></main><nav class="bottom"><button class="yes" id="yes"></button><button class="no" id="no"></button><button class="homebtn" id="home">🏠</button></nav><script>
const DATA={"categories":[{"id":"douleur","icon":"😣","color":"#df4653","items":[{"icon":"📊","fr":"Évaluer ma douleur","translations":{"en":"Assess my pain","es":"Evaluar mi dolor","de":"Meine Schmerzen einschätzen","ar":"تقييم ألمي","it":"Valutare il mio dolore"}},{"icon":"🤕","fr":"J’ai mal à la tête","translations":{"en":"I have a headache","es":"Me duele la cabeza","de":"Ich habe Kopfschmerzen","ar":"رأسي يؤلمني","it":"Ho mal di testa"}},{"icon":"😮‍💨","fr":"J’ai mal à la gorge","translations":{"en":"My throat hurts","es":"Me duele la garganta","de":"Ich habe Halsschmerzen","ar":"حلقي يؤلمني","it":"Ho mal di gola"}},{"icon":"🫁","fr":"J’ai mal à la poitrine","translations":{"en":"My chest hurts","es":"Me duele el pecho","de":"Ich habe Brustschmerzen","ar":"صدري يؤلمني","it":"Ho dolore al petto"}},{"icon":"🤰","fr":"J’ai mal au ventre","translations":{"en":"My stomach hurts","es":"Me duele el abdomen","de":"Ich habe Bauchschmerzen","ar":"بطني يؤلمني","it":"Ho mal di pancia"}},{"icon":"🦵","fr":"J’ai mal aux jambes","translations":{"en":"My legs hurt","es":"Me duelen las piernas","de":"Meine Beine tun weh","ar":"ساقاي تؤلمانني","it":"Mi fanno male le gambe"}},{"icon":"🛏️","fr":"J’ai mal au dos","translations":{"en":"My back hurts","es":"Me duele la espalda","de":"Ich habe Rückenschmerzen","ar":"ظهري يؤلمني","it":"Ho mal di schiena"}},{"icon":"📍","fr":"J’ai mal ailleurs","translations":{"en":"I have pain somewhere else","es":"Me duele otra parte del cuerpo","de":"Ich habe woanders Schmerzen","ar":"أشعر بألم في مكان آخر","it":"Ho dolore in un altro punto"}}]},{"id":"besoins","icon":"💧","color":"#327fd1","items":[{"icon":"💧","fr":"J’ai soif","translations":{"en":"I am thirsty","es":"Tengo sed","de":"Ich habe Durst","ar":"أنا عطشان","it":"Ho sete"}},{"icon":"🍽️","fr":"J’ai faim","translations":{"en":"I am hungry","es":"Tengo hambre","de":"Ich habe Hunger","ar":"أنا جائع","it":"Ho fame"}},{"icon":"🚽","fr":"Je veux aller aux toilettes","translations":{"en":"I need to use the ike vomiting","es":"Tengo ganas de vomitar","de":"Mir ist übel","ar":"أشعر بالغثيان","it":"Mi viene da vomitare"}}]},{"id":"soins","icon":"🏥","color":"#12a28f","items":[{"icon":"👩‍⚕️","fr":"Je veux voir un soignant","translations":{"en":"I want to see a nurse or doctor","es":"Quiero ver a un profesional sanitario","de":"Ich möchte eine Pflegekraft oder einen Arzt sehen","ar":"أريد رؤية أحد أفراد الطاقم الطبي","it":"Voglio vedere un infermiere o un medico"}},{"icon":"🫁","fr":"J’ai du mal à respirer","translations":{"en":"I am having trouble breathing","es":"Me cuesta respirar","de":"Ich bekomme schlecht Luft","ar":"أجد صعوبة في التنفس","it":"Faccio fatica a respirare"}},{"icon":"🛏️","fr":"Repositionnez-moi","translations":{"en":"Reposition me","es":"Cámbienme de posición","de":"Bitte lagern Sie mich um","ar":"غيّروا وضعيتي","it":"Cambiatemi posizione"}},{"icon":"🧴","fr":"Je veux des soins de bouche","translations":{"en":"I need mouth care","es":"Necesito higiene bucal","de":"Ich brauche Mundpflege","ar":"أريد تنظيف فمي","it":"Ho bisogno che mi puliate la bocca"}},{"icon":"❓","fr":"Expliquez-moi ce que vous faites","translations":{"en":"Explain what you are doing","es":"Explíqueme lo que está haciendo","de":"Erklären Sie mir, was Sie tun","ar":"اشرحوا لي ما تفعلونه","it":"Spiegatemi cosa state facendo"}}]},{"id":"proches","icon":"👨‍👩‍👧","color":"#3ba84f","items":[{"icon":"👨‍👩‍👧","fr":"Je veux voir ma famille","translations":{"en":"I want to see my family","es":"Quiero ver a mi familia","de":"Ich möchte meine Familie sehen","ar":"أريد رؤية عائلتي","it":"Voglio vedere la mia famiglia"}},{"icon":"📞","fr":"Je veux appeler un proche","translations":{"en":"I want to call a loved one","es":"Quiero llamar a un familiar","de":"Ich möchte einen Angehörigen anrufen","ar":"أريد الاتصال بأحد أقاربي","it":"Voglio chiamare un familiare"}},{"icon":"✍️","fr":"Je veux écrire","translations":{"en":"I want to write","es":"Quiero escribir","de":"Ich möchte schreiben","ar":"أريد أن أكتب","it":"Voglio scrivere"}},{"icon":"📍","fr":"Où suis-je ?","translations":{"en":"Where am I?","es":"¿Dónde estoy?","de":"Wo bin ich?","ar":"أين أنا؟","it":"Dove mi trovo?"}},{"icon":"📅","fr":"Quel jour sommes-nous ?","translations":{"en":"What day is it?","es":"¿Qué día es hoy?","de":"Welcher Tag ist heute?","ar":"ما هو اليوم؟","it":"Che giorno è oggi?"}},{"icon":"🕐","fr":"Quelle heure est-il ?","translations":{"en":"What time is it?","es":"¿Qué hora es?","de":"Wie spät ist es?","ar":"كم الساعة؟","it":"Che ore sono?"}}]},{"id":"reponses","icon":"💬","color":"#168995","items":[{"icon":"👍","fr":"Oui","translations":{"en":"Yes","es":"Sí","de":"Ja","ar":"نعم","it":"Sì"}},{"icon":"👎","fr":"Non","translations":{"en":"No","es":"No","de":"Nein","ar":"لا","it":"No"}},{"icon":"🤷","fr":"Je ne sais pas","translations":{"en":"I do not know","es":"No lo sé","de":"Ich weiß es nicht","ar":"لا أعرف","it":"Non lo so"}},{"icon":"🔁","fr":"Répétez s’il vous plaît","translations":{"en":"Please repeat","es":"Repita, por favor","de":"Bitte wiederholen","ar":"أعد من فضلك","it":"Ripetete, per favore"}},{"icon":"🐢","fr":"Parlez plus lentement","translations":{"en":"Speak more slowly","es":"Hable más despacio","de":"Sprechen Sie langsamer","ar":"تحدث ببطء أكثر","it":"Parlate più lentamente"}},{"icon":"✋","fr":"Stop","translations":{"en":"Stop","es":"Pare","de":"Stopp","ar":"توقف","it":"Fermatevi"}}]}],"ui":{"fr":{"cats":["Douleur","Besoins","Ressenti","Soins","Proches","Réponses","Écrire"],"choose":"CHOISISSEZ UN THÈME","write":"ÉCRIRE EN GROSSES LETTRES","back":"← Thèmes","speak":"🔊 Parler","clear":"✕ Effacer","placeholder":"Touchez une image pour parler…","space":"ESPACE","say":"🔊 DIRE","note":"Prototype autonome : aucune traduction en ligne. La voix dépend des langues installées sur l’appareil.","yes":"OUI","no":"NON","staff":"Pour le soignant : "},"en":{"cats":["Pain","Needs","Feelings","Care","Family","Answers","Type"],"choose":"CHOOSE A TOPIC","write":"TYPE IN LARGE LETTERS","back":"← Topics","speak":"🔊 Speak","clear":"✕ Clear","placeholder":"Touch a picture to speak…","space":"SPACE","say":"🔊 SAY","note":"Offline translations. Speech depends on voices available on the device.","yes":"YES","no":"NO","staff":"French for staff: "},"es":{"cats":["Dolor","Necesidades","Emociones","Cuidados","Familia","Respuestas","Escribir"],"choose":"ELIJA UN TEMA","write":"ESCRIBIR EN LETRAS GRANDES","back":"← Temas","speak":"🔊 Hablar","clear":"✕ Borrar","placeholder":"Toque una imagen para hablar…","space":"ESPACIO","say":"🔊 DECIR","note":"Traducciones sin conexión. La voz depende del dispositivo.","yes":"SÍ","no":"NO","staff":"Francés para el personal: "},"de":{"cats":["Schmerzen","Bedürfnisse","Gefühle","Pflege","Familie","Antworten","Schreiben"],"choose":"THEMA AUSWÄHLEN","write":"IN GROSSBUCHSTABEN SCHREIBEN","back":"← Themen","speak":"🔊 Sprechen","clear":"✕ Löschen","placeholder":"Bild antippen, um zu sprechen…","space":"LEERTASTE","say":"🔊 SAGEN","note":"Übersetzungen ohne Internet. Sprachausgabe hängt vom Gerät ab.","yes":"JA","no":"NEIN","staff":"Französisch für das Personal: "},"ar":{"cats":["الألم","الاحتياجات","المشاعر","الرعاية","العائلة","الإجابات","الكتابة"],"choose":"اختر موضوعًا","write":"اكتب بأحرف كبيرة","back":"→ المواضيع","speak":"🔊 تحدث","clear":"✕ مسح","placeholder":"المس صورة للتحدث…","space":"مسافة","say":"🔊 انطق","note":"الترجمات متاحة دون إنترنت. يعتمد الصوت على الجهاز.","yes":"نعم","no":"لا","staff":"بالفرنسية للطاقم: "},"it":{"cats":["Dolore","Bisogni","Emozioni","Cure","Famiglia","Risposte","Scrivere"],"choose":"SCEGLI UN ARGOMENTO","write":"SCRIVI IN LETTERE GRANDI","back":"← Argomenti","speak":"🔊 Parla","clear":"✕ Cancella","placeholder":"Tocca un’immagine per parlare…","space":"SPAZIO","say":"🔊 LEGGI","note":"Traduzioni disponibili senza connessione. La voce dipende dalle lingue installate sul dispositivo.","yes":"SÌ","no":"NO","staff":"Francese per il personale: "}}};
const langs={fr:'fr-FR',en:'en-GB',ar:'ar-SA',es:'es-ES',de:'de-DE',it:'it-IT'};
let lang='fr',section='accueil',active=null,current=null,typed='';
const el=id=>document.getElementById(id),ui=()=>DATA.ui[lang];
function translated(item){return lang==='fr'?item.fr:item.translations[lang]}
function setMessage(value,fr){current={value,fr};el('phrase').textContent=value;el('staff').hidden=lang==='fr'||!fr;el('staff').textContent='🇫🇷 '+fr}
function clear(){current=null;typed='';el('typed').textContent='';el('phrase').textContent=ui().placeholder;el('staff').hidden=true}
function speak(text){if(!text||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=langs[lang];u.rate=.85;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().split('-')[0]===lang);if(voice)u.voice=voice;window.speechSynthesis.speak(u)}
function say(value,fr){setMessage(value,fr);speak(value)}
function show(name){section=name;for(const s of ['accueil','categorie','clavier'])el(s).hidden=s!==name;window.scrollTo(0,0)}
function category(k){active=k;renderItems();show('categorie')}
function renderItems(){const d=DATA.categories.find(c=>c.id===active);if(!d)return;const idx=DATA.categories.indexOf(d);el('title').textContent=ui().cats[idx].toUpperCase();el('items').replaceChildren();for(const item of d.items){const b=document.createElement('button');b.className='item';b.style.setProperty('--c',d.color);const icon=document.createElement('span');icon.className='icon';icon.textContent=item.icon;const label=document.createElement('span');label.className='patient-label';label.textContent=translated(item);b.append(icon,label);if(lang!=='fr'){const translation=document.createElement('span');translation.className='fr-translation';translation.lang='fr';translation.textContent='🇫🇷 '+item.fr;b.append(translation)}b.onclick=()=>say(translated(item),item.fr);el('items').append(b)}}
function renderCategories(){el('categories').replaceChildren();DATA.categories.forEach((d,idx)=>{const b=document.createElement('button');b.className='category';b.style.setProperty('--c',d.color);const icon=document.createElement('span');icon.className='icon';icon.textContent=d.icon;b.append(icon,document.createTextNode(ui().cats[idx]));b.onclick=()=>category(d.id);el('categories').append(b)});const b=document.createElement('button');b.className='category';b.style.setProperty('--c','#596873');const i=document.createElement('span');i.className='icon';i.textContent='⌨️';b.append(i,document.createTextNode(ui().cats[6]));b.onclick=()=>show('clavier');el('categories').append(b)}
const keyboards={fr:"ABCDEFGHIJKLMNOPQRSTUVWXYZÉÈÊÀÂÎÔÛÇÙ'?!.,",en:"ABCDEFGHIJKLMNOPQRSTUVWXYZ'?!.,",es:"ABCDEFGHIJKLMNÑOPQRSTUVWXYZÁÉÍÓÚÜ'¿¡?!.,",de:"ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜẞ'?!.,",it:"ABCDEFGHIJKLMNOPQRSTUVWXYZÀÈÉÌÒÙ'?!.,",ar:"ابتثجحخدذرزسشصضطظعغفقكلمنهويءأإآؤئىة؟!،."};
function renderKeyboard(){el('keys').replaceChildren();for(const char of keyboards[lang]){const b=document.createElement('button');b.className='key';b.textContent=char;b.onclick=()=>type(char);el('keys').append(b)}addKey(ui().space,()=>type(' '));addKey('⌫',()=>{typed=typed.slice(0,-1);updateTyped()});addKey(ui().say,()=>speak(typed))}
function addKey(label,fn){const b=document.createElement('button');b.className='key wide';b.textContent=label;b.onclick=fn;el('keys').append(b)}
function updateTyped(){el('typed').textContent=typed;if(typed)setMessage(typed,'');else{current=null;el('phrase').textContent=ui().placeholder;el('staff').hidden=true}}
function type(c){typed+=c;updateTyped()}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';el('choose').textContent=ui().choose;el('write').textContent=ui().write;el('back1').textContent=ui().back;el('back2').textContent=ui().back;el('speak').textContent=ui().speak;el('clear').textContent=ui().clear;el('note').textContent=ui().note;el('yes').textContent='👍 '+ui().yes;el('no').textContent='👎 '+ui().no;renderCategories();renderKeyboard();if(active)renderItems();clear()}
el('language').onchange=e=>{lang=e.target.value;render()};el('speak').onclick=()=>{if(current)speak(current.value)};el('clear').onclick=clear;el('back1').onclick=()=>show('accueil');el('back2').onclick=()=>show('accueil');el('home').onclick=()=>show('accueil');el('yes').onclick=()=>say(ui().yes,'Oui');el('no').onclick=()=>say(ui().no,'Non');render();
</script></body></html>
